<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon maker - Flash Card Practice App</title>
<style>body{margin:0;padding:24px;background:#140f2e;color:#f4efff;font-family:system-ui,sans-serif}h1{font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}figure{margin:0;text-align:center}canvas{background:#0b0820;border:3px solid #0b0820;border-radius:12px;max-width:160px;height:auto}
button{margin-top:8px;min-height:44px;border:3px solid #0b0820;border-radius:12px;background:#ffd23f;font-weight:700;padding:0 14px;cursor:pointer;box-shadow:0 4px 0 #0b0820}
p{max-width:640px;line-height:1.7}</style></head><body>
<h1>Icon maker (no Node / Python needed)</h1>
<p>Click each button and save the PNG into the <code>icons/</code> folder with the shown name. Edit the SVG below to change the design (keep it in sync with <code>icons/icon.svg</code>).</p>
<div class="row" id="out"></div>
<script id="svg" type="text/plain"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#140f2e"/>
  <circle cx="420" cy="96" r="54" fill="#ffd23f" opacity=".85"/>
  <circle cx="86" cy="430" r="34" fill="#3fd0ff" opacity=".7"/>
  <circle cx="120" cy="120" r="5" fill="#fff"/><circle cx="380" cy="400" r="4" fill="#fff"/><circle cx="300" cy="70" r="3" fill="#fff"/>
  <g transform="rotate(-8 256 280)">
    <rect x="96" y="160" width="320" height="230" rx="36" fill="#0b0820"/>
    <rect x="96" y="148" width="320" height="230" rx="36" fill="#f4efff" stroke="#0b0820" stroke-width="12"/>
    <text x="256" y="312" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" font-size="150" font-weight="700" fill="#ff5fa2" text-anchor="middle">?</text>
  </g>
  <g transform="translate(300 96) scale(1.25)">
    <path d="M60 14c30 0 48 26 48 54 0 26-20 40-48 40S12 94 12 68C12 40 30 14 60 14z" fill="#ff5fa2" stroke="#0b0820" stroke-width="7"/>
    <ellipse cx="34" cy="52" rx="9" ry="5" fill="#fff" opacity=".5"/>
    <circle cx="44" cy="62" r="10" fill="#fff" stroke="#0b0820" stroke-width="5"/><circle cx="76" cy="62" r="10" fill="#fff" stroke="#0b0820" stroke-width="5"/>
    <circle cx="46" cy="63" r="4.5" fill="#0b0820"/><circle cx="78" cy="63" r="4.5" fill="#0b0820"/>
    <path d="M50 84q10 8 20 0" fill="none" stroke="#0b0820" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
</script>
<script>
var SIZES=[["icon-192.png",192,0],["icon-512.png",512,0],["icon-maskable-512.png",512,0.12],["apple-touch-icon.png",180,0.06]];
var src=document.getElementById("svg").textContent;
var url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(src);
var img=new Image();img.onload=function(){SIZES.forEach(function(s){
  var c=document.createElement("canvas");c.width=c.height=s[1];var g=c.getContext("2d");
  if(s[2]){g.fillStyle="#140f2e";g.fillRect(0,0,s[1],s[1]);var p=s[1]*s[2];g.drawImage(img,p,p,s[1]-2*p,s[1]-2*p);}else g.drawImage(img,0,0,s[1],s[1]);
  var b=document.createElement("button");b.textContent="Download "+s[0];
  b.onclick=function(){c.toBlob(function(bl){var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=s[0];a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},3000);},"image/png");};
  var f=document.createElement("figure");f.appendChild(c);f.appendChild(document.createElement("br"));f.appendChild(b);document.getElementById("out").appendChild(f);});};
img.src=url;
</script></body></html>
