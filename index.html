<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f2e">
<meta name="description" content="Offline flash card practice for every grade and subject. CSV / Excel / ZIP, pictures, audio, math and chemistry, English and Myanmar.">
<title>Flash Card Practice App V2.0.4</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ===== Fonts (bundled locally, see README: fonts/) ===== */
@font-face{font-family:"Fredoka";src:url("fonts/fredoka-latin-wght-normal.woff2") format("woff2-variations"),url("fonts/fredoka-latin-wght-normal.woff2") format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/noto-sans-myanmar-myanmar-400-normal.woff2") format("woff2");font-weight:400;font-display:swap;unicode-range:U+1000-109F,U+200C-200D,U+25CC,U+A92E,U+A9E0-A9FE,U+AA60-AA7F}
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/noto-sans-myanmar-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215}
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/noto-sans-myanmar-myanmar-600-normal.woff2") format("woff2");font-weight:500 600;font-display:swap;unicode-range:U+1000-109F,U+200C-200D,U+25CC,U+A92E,U+A9E0-A9FE,U+AA60-AA7F}
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/noto-sans-myanmar-latin-600-normal.woff2") format("woff2");font-weight:500 600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215}
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/noto-sans-myanmar-myanmar-800-normal.woff2") format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+1000-109F,U+200C-200D,U+25CC,U+A92E,U+A9E0-A9FE,U+AA60-AA7F}
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/noto-sans-myanmar-latin-800-normal.woff2") format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215}
@font-face{font-family:"FC Math";src:url("fonts/STIXTwoMath-Regular.woff2") format("woff2");font-display:swap}

:root{
  --bg:#140f2e;--deep:#0b0820;--ink:#0b0820;--pill:#2f2566;--track:#241b4d;--light:#f4efff;--txt:#1d1640;
  --pink:#ff5fa2;--pinkT:#ffb3d4;--pinkHi:#ffafd1;--yellow:#ffd23f;--cyan:#3fd0ff;--green:#8be36b;--green2:#2fae5b;
  --rose:#ffc3cc;--red:#ff4d6d;--teal:#00636f;--peach:#ffe08a;--cream:#fff6dc;--mute:#c9c2e6;--info:#e8e3fb;--link:#4000ac;
  --f-my:"Noto Sans Myanmar","Padauk","Myanmar Text","Myanmar Sangam MN","Pyidaungsu";
  --f-world:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Hiragino Sans","Microsoft YaHei","Noto Sans JP","Noto Sans KR","Noto Sans Thai","Leelawadee UI","Tahoma","Noto Sans Arabic","Segoe UI Historic","Noto Sans Devanagari","Nirmala UI",Arial,sans-serif;
  --f-body:var(--f-my),var(--f-world);
  --f-fun:"Fredoka",var(--f-my),var(--f-world);
  --f-math:"FC Math","STIX Two Math","Cambria Math","Latin Modern Math","Noto Sans Math",math,var(--f-my),serif;
  --fs:1;--tap:44px;--markH:56px;--cardMin:clamp(240px,40dvh,460px);--cardMax:72dvh;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--light)}
html{touch-action:manipulation}   /* v2.0.4: no double-tap zoom / jump on phones; pinch zoom still works */
body{font-family:var(--f-body);line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
:lang(my),[lang|="my"]{line-height:1.9}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fun{font-family:var(--f-fun)}
.ink{border:3px solid var(--ink)}
.sticker{box-shadow:0 6px 0 var(--ink)}
.press{transition:transform .15s,box-shadow .15s,background-color .2s}
.press:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.press.pop{animation:btnpop .3s ease-out}
.hidden{display:none!important}

@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-26px) scale(.92,1.1)}60%{transform:translateY(0) scale(1.12,.88)}100%{transform:none}}
@keyframes droop{0%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}100%{transform:rotate(0) translateY(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes btnpop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes fly{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1) rotate(200deg);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
@keyframes riffle{0%{transform:none}25%{transform:translateX(-36px) rotate(-6deg)}55%{transform:translateX(30px) rotate(5deg)}100%{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Sky ===== */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff}
.planet{position:absolute;border-radius:50%}
.planet.y{right:-64px;top:96px;width:192px;height:192px;background:var(--yellow);opacity:.8;box-shadow:inset -22px -18px 0 #e0a800;animation:drift 12s ease-in-out infinite}
.planet.c{left:-40px;bottom:40px;width:112px;height:112px;background:var(--cyan);opacity:.7;box-shadow:inset -14px -10px 0 #1fa3d1;animation:drift 15s ease-in-out infinite reverse}

/* ===== Layout ===== */
.wrap{position:relative;z-index:1;margin:0 auto;max-width:896px;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px 0}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1.title{margin:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;font-family:var(--f-fun);font-weight:700;font-size:clamp(22px,3.6vw,34px);line-height:1.25;letter-spacing:-.01em}
h1.title .a{color:var(--pinkT)}h1.title .c{color:var(--yellow)}
.badge{display:inline-block;transform:rotate(-6deg);border-radius:8px;background:var(--cyan);color:var(--ink);padding:2px 8px;font-size:15px;font-weight:700;line-height:1.1;letter-spacing:.03em;box-shadow:0 3px 0 var(--ink)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tool{display:flex;align-items:center;gap:8px;height:var(--tap);min-width:var(--tap);justify-content:center;border-radius:12px;padding:0 8px;font-weight:700;font-size:16px;background:var(--pill)}
.tool:hover{transform:translateY(-2px)}
.tool[aria-pressed="true"].shuf{background:var(--pink)}
.tool.muted{background:var(--red)}
.tool .lbl{display:none}
.lang{display:flex;align-items:center;gap:2px;height:var(--tap);border-radius:12px;background:var(--pill);padding:4px}
.lang button{height:100%;border-radius:8px;padding:0 8px;font-size:15px;font-weight:700;line-height:1;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.lang button.en{font-family:var(--f-fun);letter-spacing:.03em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.deckrow{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.deckchip{border-radius:999px;background:var(--yellow);color:var(--ink);padding:3px 12px;font-size:14px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;flex:1;min-width:90px;height:16px;overflow:hidden;border-radius:999px;background:var(--track)}
.prog span{flex:1;height:100%;transition:background-color .2s}
.prog.fill span{flex:none}
.count{font-family:var(--f-fun);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.count i{font-style:normal;color:var(--mute)}
.tallies{margin-top:8px;display:flex;flex-wrap:wrap;column-gap:16px;font-weight:600}
.tallies .k{color:var(--green)}.tallies .a{color:var(--rose)}.tallies b{font-family:var(--f-fun)}
.topics{position:relative;margin:12px -16px 0;display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 40px),transparent)}
.topics::-webkit-scrollbar{display:none}
.chip{display:flex;flex:none;align-items:center;gap:6px;height:36px;white-space:nowrap;border-radius:999px;padding:0 12px;font-size:14px;font-weight:700;line-height:1.8;background:var(--pill);color:#e8e3fb;box-shadow:0 4px 0 var(--ink)}
.chip:hover{transform:translateY(-2px)}
.chip .n{border-radius:999px;padding:0 6px;font-family:var(--f-fun);font-size:14px;line-height:20px;background:var(--bg);color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.chip[aria-pressed="true"] .n{background:var(--ink);color:var(--yellow)}
.modes{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:2px;border-radius:12px;background:var(--pill);padding:4px}
.seg button{min-height:36px;border-radius:8px;padding:0 10px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.mini{height:44px;border-radius:12px;padding:0 10px;font-size:14px;font-weight:700;background:var(--pill);display:flex;gap:6px;align-items:center}
.mini[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
.notice{margin-top:8px;border-radius:12px;background:#ff4d6d22;color:#ffd0d8;padding:4px 10px;font-size:14px}

/* ===== Stage / card ===== */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:56px 0 8px}
.cardwrap{position:relative}
.moo{position:absolute;top:-56px;right:8px;z-index:3;width:96px;height:96px;pointer-events:none}
.moo svg{width:100%;height:100%;transform-origin:50% 100%}
.moo .idle{animation:bob 3s ease-in-out infinite}.moo .happy{animation:jump .6s ease-out}.moo .sad{animation:droop .6s ease-out forwards}
.moo .burst{position:absolute;left:50%;top:50%;font-size:20px;animation:fly .9s ease-out forwards}
.persp{perspective:1800px}
.card{display:grid;border-radius:28px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.35,.5,1);outline:none}
.card:focus-visible{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--yellow)}
.card.flipped{transform:rotateY(180deg)}
.card.anim-pop{animation:pop .35s ease-out}.card.anim-riffle{animation:riffle .55s ease-out}
.face{grid-area:1/1;display:flex;flex-direction:column;gap:12px;min-height:var(--cardMin);max-height:var(--cardMax);overflow-y:auto;overflow-x:hidden;border-radius:28px;padding:16px 20px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overscroll-behavior:contain}
.face.front{background:var(--light);color:var(--txt)}
.face.back{background:var(--teal);color:var(--light);transform:rotateY(180deg);padding-bottom:20px}
.card:not(.flipped) .face.back,.card.flipped .face.front{pointer-events:none}
.lab{margin:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;padding-right:96px;font-weight:800;font-size:16px}
.front .lab{color:#c2185b}.front .lab .no{font-family:var(--f-fun);color:#1d164088}
.back .lab{color:var(--peach)}.back .lab .no{font-family:var(--f-fun);color:#d9f3f6}
.tag{border-radius:999px;background:#ffd23f55;padding:0 10px;font-size:14px;font-weight:700;line-height:1.9;color:#5a3d00}
.back .tag{background:#ffffff22;color:#e6fbff}
.qtext{margin:0;font-size:calc(clamp(19px,2.8vw,28px)*var(--fs));font-weight:600;line-height:1.9;overflow-wrap:anywhere}
.atext{margin:0;font-size:calc(clamp(26px,4.6vw,52px)*var(--fs));font-weight:800;line-height:1.7;color:var(--yellow);text-shadow:0 3px 0 var(--ink);overflow-wrap:anywhere}
.atext:lang(en),.atext.latin{font-family:var(--f-fun)}
.sent{margin:0;font-size:calc(clamp(17px,2.2vw,22px)*var(--fs));line-height:1.9;color:var(--light)}
.cap{margin:-4px 0 0;font-size:14px;opacity:.75;text-align:center}
.expl{border-radius:16px;background:#00000026;padding:8px 12px;font-size:calc(16px*var(--fs))}
.expl b.h{display:block;font-size:13px;color:var(--peach)}
.taphint{margin:auto 0 0;padding-top:4px;text-align:center;font-size:16px;color:#1d164099}
.facebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbtn{min-width:var(--tap);height:var(--tap);border-radius:999px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;background:#1d164012;color:var(--txt)}
.back .fbtn{background:#ffffff1f;color:var(--light)}
.fbtn[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.bubble{border-radius:16px;background:var(--peach);color:#5a3d00;padding:6px 12px;font-weight:600;animation:pop .25s}
.back .bubble{background:#ffffff26;color:var(--light)}
.blank{display:inline-block;width:4em;margin:0 4px;transform:translateY(.2em);border-bottom:4px dotted var(--pink)}
mark.fill{margin:0 4px;border-radius:8px;background:var(--yellow);color:var(--ink);padding:0 8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gal{display:grid;gap:8px}
.gal.n2,.gal.n3,.gal.n4{grid-template-columns:1fr 1fr}
.gal.n5,.gal.n6{grid-template-columns:1fr 1fr 1fr}
.gal.n3 .ph:first-child{grid-column:span 2}
.gal.n5 .ph:first-child{grid-column:span 2}
.ph{position:relative;overflow:hidden;border-radius:16px;background:#fff;height:clamp(140px,24vh,260px);display:grid;place-items:center}
.gal:not(.n1) .ph{height:clamp(90px,15vh,150px)}
.back .ph{background:#fff;box-shadow:inset 0 0 0 999px var(--cream)}
.ph img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;display:block}   /* whole picture always visible (v2.0.3 fix) */
.ph .num{z-index:1}
.ph .num{position:absolute;left:6px;top:6px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-family:var(--f-fun);font-size:18px;font-weight:700;color:var(--ink);background:var(--pink)}
.back .ph .num{background:var(--yellow)}
.ph .miss{padding:8px;text-align:center;font-size:14px;color:#a0102c}
.rt table{border-collapse:collapse;font-size:.85em;min-width:100%}
.rt .tbl{max-width:100%;overflow-x:auto;margin:4px 0;border-radius:12px}
.rt th,.rt td{border:2px solid currentColor;padding:4px 10px;text-align:left}
.rt th{background:#00000014}
.rt ul,.rt ol{margin:4px 0;padding-inline-start:1.4em}
.math{font-family:var(--f-math)}
.math math{font-size:1.05em}
.math-block{display:block;margin:6px 0;overflow-x:auto;text-align:center}
.math-src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em}
.atext .math math{text-shadow:none}

/* audio player */
.aud{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-radius:16px;padding:6px;background:#1d164010}
.back .aud{background:#00000026}
.aud button{min-width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;font-weight:700;font-size:14px;background:var(--pill);color:var(--light)}
.aud button.play{background:var(--pink);color:var(--ink);min-width:48px;height:48px}
.aud button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.aud input[type=range]{flex:1;min-width:90px;accent-color:var(--pink);height:32px}
.aud .tm{font-family:var(--f-fun);font-size:14px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.aud .nm{width:100%;font-size:12px;opacity:.7;padding-left:4px}
.aud.missing{color:#a0102c;font-size:14px;padding:8px 12px}

/* ===== Bottom bar ===== */
.bar{position:sticky;bottom:0;z-index:5;margin-top:24px;padding:8px 0 max(10px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,#140f2e00,#140f2e 30%)}
.btns{display:flex;align-items:center;justify-content:center;gap:8px}
.round{display:grid;place-items:center;flex:none;width:44px;height:var(--markH);border-radius:16px;background:var(--pill);color:var(--light)}
.round:hover:not(:disabled){transform:translateY(-2px)}
.round:disabled{opacity:.3}
.round svg.i{width:26px;height:26px}
.mark{display:flex;flex:1;min-width:0;min-height:var(--markH);align-items:center;justify-content:center;gap:6px;border-radius:16px;padding:4px 8px;text-align:center;font-size:15px;line-height:1.5;font-weight:800;color:var(--ink)}
.mark svg.i{display:none;width:20px;height:20px}
.mark.again{background:var(--rose)}.mark.know{background:var(--green)}
.mark.again.on{background:var(--red);color:#fff}.mark.know.on{background:var(--green2);color:#fff}
.mark:disabled{opacity:.35}
.helper{margin:10px 0 0;text-align:center;font-size:16px;color:#d2cde3}
.helper.inv{visibility:hidden}
.kbd{display:none;margin:4px 0 0;text-align:center;font-size:13px;color:var(--mute)}
kbd{font-family:var(--f-fun);border:2px solid #ffffff44;border-bottom-width:3px;border-radius:6px;padding:0 5px;margin:0 2px}

/* ===== Results ===== */
.res{margin:56px auto 0;width:100%;max-width:576px;border-radius:28px;background:var(--light);color:var(--txt);padding:24px;text-align:center;animation:pop .4s}
.res .moo{position:relative;top:auto;right:auto;margin:-80px auto 4px}
.res .msg{margin:0;font-size:24px;font-weight:800;line-height:1.8}
.res .pct{margin:0;font-family:var(--f-fun);font-size:72px;font-weight:700;line-height:1.1;color:var(--pink);-webkit-text-stroke:3px var(--ink)}
.res .two{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res .two div{border-radius:16px;padding:12px}
.res .two b{display:block;font-family:var(--f-fun);font-size:30px}
.res .missed{margin-top:16px;max-height:192px;overflow:auto;border-radius:16px;background:#1d164010;padding:12px;text-align:left}
.res .missed p{margin:0;padding:8px 0;border-bottom:1px solid #1d164022;line-height:1.8}
.res .missed p:last-child{border:0}
.res .missed b{color:#0b5228}
.res .acts{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.bigbtn{display:flex;min-height:56px;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:8px 20px;font-size:18px;font-weight:800;color:var(--ink)}
.bigbtn.pink{background:var(--pink)}.bigbtn.cyan{background:var(--cyan)}

/* ===== Modals ===== */
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:#0b0820cc;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.panel{width:100%;max-width:576px;max-height:92dvh;overflow:auto;border-radius:28px;background:var(--light);color:var(--txt);padding:20px;animation:pop .3s}
.panel .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.panel h2{margin:0;font-size:24px;font-weight:800;line-height:1.8}
.panel h3{margin:16px 0 6px;font-size:18px;font-weight:800}
.x{display:grid;flex:none;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--yellow);color:var(--ink)}
.lnk{font-weight:700;color:var(--link);text-decoration:underline;line-height:1.8;text-align:left}
.sub{margin:0;color:#1d1640aa;line-height:1.8}
.drop{margin-top:16px;display:flex;width:100%;flex-direction:column;align-items:center;gap:4px;border-radius:16px;background:var(--cyan);padding:20px 16px;font-weight:800;color:var(--ink);text-align:center}
.drop.over{background:#8fe6ff}

.mathgrid{margin-top:4px;display:grid;grid-template-columns:1fr;gap:6px 24px}
.mathgrid span.r{display:flex;align-items:center;gap:8px;white-space:nowrap}

textarea.paste:focus{outline:none;box-shadow:0 0 0 4px var(--pink)}
.build{margin-top:12px;height:48px;width:100%;border-radius:16px;background:var(--pink);font-size:18px;font-weight:800;color:var(--ink)}
.build:disabled{opacity:.4}
.status{margin-top:12px;border-radius:12px;padding:12px;line-height:1.8}
.status.ok{background:#8be36b44;color:#14532d}.status.bad{background:#ff4d6d22;color:#a0102c}
.status details{margin-top:6px}.status summary{cursor:pointer;font-weight:700}
.status ul{margin:4px 0 0;padding-left:20px;max-height:180px;overflow:auto;font-size:14px}
.decks{display:flex;flex-direction:column;gap:6px}
.deckbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-radius:14px;background:#fff;padding:6px 10px;text-align:left;color:var(--txt);border:2px solid #1d164022}
.deckbtn[aria-current="true"]{border-color:var(--ink);background:#fff3c4}

.deckbtn .meta{font-size:13px;color:#1d1640aa}
.deckbtn .ct{font-family:var(--f-fun);font-weight:700;border-radius:999px;background:var(--ink);color:var(--yellow);padding:0 8px}
.del{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#a0102c}

.row label{font-weight:700}
.row select,.row input[type=text]{min-height:44px;border-radius:12px;border:3px solid var(--ink);background:#fff;padding:0 10px;color:var(--txt);max-width:100%}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid #1d164018}
.sw input{width:24px;height:24px;accent-color:var(--pink)}
.segl{display:flex;flex-wrap:wrap;gap:6px}
.segl button{min-height:44px;border-radius:12px;border:3px solid var(--ink);background:#fff;padding:0 12px;font-weight:700;color:var(--txt)}
.segl button[aria-pressed="true"]{background:var(--yellow)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.keys kbd{border-color:#1d164055;color:var(--txt)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#0b0820ee;padding:16px;touch-action:none;animation:pop .25s}
.lb .stagei{max-width:100%;max-height:82dvh;overflow:hidden;border-radius:16px;background:#fff}
.lb img{display:block;max-width:min(100vw - 32px,1200px);max-height:82dvh;object-fit:contain;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.lb .x{position:absolute;right:16px;top:16px;width:48px;height:48px}
.lb .nav{position:absolute;bottom:20px;display:flex;align-items:center;gap:12px}
.lb .nav button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--light);color:var(--ink)}
.lb .nav button:disabled{opacity:.3}
.lb .nav span{font-family:var(--f-fun);font-size:24px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;gap:10px;align-items:center;border-radius:16px;background:var(--light);color:var(--txt);padding:10px 14px;font-weight:700;animation:pop .3s;max-width:calc(100vw - 32px)}
.toast button{border-radius:10px;background:var(--yellow);padding:6px 12px;font-weight:800;color:var(--ink);min-height:40px}

/* ===== Responsive ===== */
@media (min-width:640px){
  .wrap{padding:20px 24px 0}
  .tool{padding:0 12px}.tool .lbl{display:inline}.tool.icononly .lbl{display:none}
  .lang button{padding:0 10px}
  .moo{top:-64px;right:24px;width:112px;height:112px}
  .face{padding:20px 32px 16px}
  .btns{gap:16px}
  .round{width:56px}
  .mark{max-width:240px;padding:4px 20px;font-size:18px;white-space:nowrap}
  .mark svg.i{display:block}
  .topics{margin:12px 0 0;padding:0 0 8px;flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}
  .mathgrid{grid-template-columns:1fr 1fr}
  .panel{padding:28px}
  .res{padding:32px}
  .res .acts{flex-direction:row;justify-content:center}
  .bar{position:static;background:none}
}
@media (max-width:639px){
  .stage{padding-top:52px}
}
@supports not (height:1svh){@media (max-width:639px){:root{--cardMax:58vh}}}

/* ===== Audience profiles ===== */
body.p-kids{--fs:1.18;--tap:56px;--markH:64px}
body.p-kids .mark{font-size:20px}
body.p-kids .tool,body.p-kids .chip{font-size:18px}
body.p-kids .chip{height:48px}
body.p-kids .fbtn{font-size:18px}
body.p-kids .back .gal{order:-1}
body.p-kids .lab{font-size:19px}
body.p-senior{--fs:.88;--cardMin:clamp(220px,34dvh,420px);--cardMax:76dvh}
body.p-senior .qtext{font-weight:500}
body.p-senior .atext{text-shadow:0 2px 0 var(--ink)}
body.p-senior .kbd{display:block}
body.nomoo .cardwrap>.moo{display:none}
body.nomoo .lab{padding-right:0}

/* ===== Reduced motion ===== */
body.rm *,body.rm *::before,body.rm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
body.rm .card{transform:none!important}
body.rm .face.back{transform:none}
body.rm .face{transition:opacity .25s!important}
body.rm .card .face.back{opacity:0}
body.rm .card.flipped .face.back{opacity:1}
body.rm .card.flipped .face.front{opacity:0}
body.rm .star{opacity:.6}

/* ===== v2.0.1: tap targets >= 44px (hit area grows, look stays), V1.3 phone planets ===== */
.lang button,.deckchip,.chip,.seg button,.aud button,.mini,.fbtn,.lnk{position:relative}
.lang button::after,.deckchip::after,.chip::after,.seg button::after{content:"";position:absolute;left:-2px;right:-2px;top:-7px;bottom:-7px}
.aud button::after{content:"";position:absolute;inset:-2px}
.lnk{min-height:44px;display:inline-flex;align-items:center}
.lang button,.seg button{min-width:44px}
.taphint{display:block;width:100%;min-height:44px;border-radius:12px;font:inherit;font-size:16px;color:#1d164099}
.taphint:focus-visible{outline:3px solid var(--pink)}
.aud button{min-width:44px;height:44px}
body.p-kids .aud button{min-width:56px;height:56px;font-size:18px}
body.p-kids .lang,body.p-kids .seg button,body.p-kids .mini,body.p-kids .deckchip{min-height:56px}
body.p-kids .deckchip{display:inline-flex;align-items:center}
@media (max-width:639px){
  .planet{display:none}
  #bFull{display:none}                                   /* V1.3: no full screen button on phones */
  header.top{gap:8px}
  h1.title{font-size:21px}.badge{font-size:13px}
  .tools{gap:4px}
  .deckrow{margin-top:10px}
  .tallies{margin-top:4px;font-size:14px}
  .topics{margin-top:8px}
  .stage{padding-top:48px}
  .mark{font-size:14px;line-height:1.35;padding:2px 6px}
  .tile{min-height:76px;font-size:14px}
}
@media (max-width:639px){
  /* v2.0.4: Again / I know it bar is pinned to the bottom of the screen, always visible */
  .bar{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,#140f2e00,#140f2e 22%)}
  .wrap{padding-bottom:calc(132px + env(safe-area-inset-bottom))}
  :root{--cardMax:58svh}
}
@media (max-width:639px) and (max-height:760px){
  :root{--cardMin:clamp(180px,30svh,300px);--cardMax:52svh}
  .moo{width:80px;height:80px;top:-46px}
  .stage{padding-top:40px}
  .helper{margin-top:4px;font-size:14px}
}
.tile .rt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
/* ===== Phase 2: modes ===== */
.mark.easy{background:var(--cyan)}
.srsinfo{font-size:14px;font-weight:700;color:var(--peach);padding:0 4px}
.typebox{margin-top:16px}
.typerow{display:flex;gap:8px}
.typein{flex:1;min-width:0;min-height:52px;border-radius:16px;background:#fff;color:var(--txt);padding:0 14px;font-size:calc(20px*var(--fs))}
.typein:focus{outline:none;box-shadow:0 0 0 4px var(--pink)}
.typein:disabled{background:#e8e3fb}
.verdict{margin-top:10px;border-radius:16px;padding:10px 14px;line-height:1.8;animation:pop .3s}
.verdict.ok{background:#8be36b;color:var(--ink)}.verdict.bad{background:#ffc3cc;color:var(--ink)}
.diff .extra{text-decoration:line-through;color:#a0102c}.diff .need{background:#ffd23f;border-radius:4px;text-decoration:underline}
.mhead{text-align:center;font-family:var(--f-fun);font-size:20px;font-weight:700;margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mgrid.kids{grid-template-columns:repeat(2,1fr)}

.tile{min-height:96px;border-radius:18px;background:var(--light);color:var(--txt);padding:8px;font-weight:700;font-size:calc(16px*var(--fs));line-height:1.6;display:grid;place-items:center;overflow:hidden;overflow-wrap:anywhere}
body.p-kids .tile{min-height:130px;font-size:22px}
.tile img{max-width:100%;max-height:110px;object-fit:contain}
.tile.sel{background:var(--yellow)}
.tile.ok{background:var(--green);opacity:.55}
.tile.bad{background:var(--rose);animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stars{margin:4px 0;font-size:34px;letter-spacing:4px}
body.p-senior .stars{font-size:24px}

/* 3D + guide */
.m3d{position:relative;height:clamp(200px,34dvh,340px);border-radius:16px;background:radial-gradient(circle at 50% 40%,#fff,#e8e3fb);overflow:hidden;color:var(--txt)}

.m3msg.err{color:#a0102c}
.spin{width:22px;height:22px;border:4px solid #1d164033;border-top-color:var(--pink);border-radius:50%;animation:spin 1s linear infinite}
.m3bar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.m3bar button{width:44px;height:44px;border-radius:12px;background:var(--pill);color:var(--light);font-size:20px;font-weight:700}
.m3bar button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
pre.gx{margin:6px 0 2px;white-space:pre-wrap;word-break:break-word;border-radius:12px;background:#fff;border:2px solid #1d164022;padding:10px;font-size:13px;line-height:1.6;color:var(--txt);font-family:ui-monospace,Menlo,Consolas,"Noto Sans Myanmar",monospace}
@media (max-width:639px){
  .modes{flex-wrap:nowrap;overflow-x:auto;margin:6px -16px 0;padding:0 16px 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 40px),transparent)}
  .modes::-webkit-scrollbar{display:none}
  .modes>*{flex:none}
  .seg{flex-wrap:nowrap}.seg button{white-space:nowrap}
}
/* ===== Print: A4, 8 (or 4) cards per page, dashed cut lines ===== */
.print-root{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important;color:#000}
  body>*:not(.print-root){display:none!important}
  .print-root{display:block!important}
  .pp{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:calc(277mm / 4);break-after:page;page-break-after:always}
  .per4 .pp{grid-auto-rows:calc(277mm / 2)}

  .per4 .pc{font-size:24pt}

  .pc .blank{border-bottom-color:#000}
  .pc mark.fill{background:#eee;color:#000}
}

            var b = dataURLtoBlob(imgs[k]); if (!b) return;
            var key = mediaKey(k);
            return DB.put('media', key, { name: key, type: b.type, blob: b, added: Date.now() }).then(function () { MEDIA.names.add(key); });
          });
        }, Promise.resolve()).then(function () {
          var rep = [], cards = rec.cards.map(function (c, i) {
            return buildCard({ front: c.q || '', back: c.a || '', topic: c.topic || '', front_image: c.qImgs || [], back_image: c.aImgs || [] }, i + 2, rep);
          }).filter(Boolean);
          var deck = { id: 'd-v1', name: 'My previous deck', titleKey: 'migrated', origTitle: rec.title || '', pasted: false, cards: cards, created: Date.now(), migrated: true };
          return saveDeck(deck).then(function () { return DB.get('decks', 'd-v1'); }).then(function (check) {
            if (!check || !check.cards || check.cards.length !== cards.length) throw new Error('verify failed');
            return kvSet('current', 'd-v1').then(function () { return kvSet('migratedV1', 1); }).then(function () { try { indexedDB.deleteDatabase('fc-flashcards'); } catch (e) { } });
          });
        });
      });
    });
  }).catch(function (e) { console.warn('V1 migration skipped; V1 data kept', e); });
}

/* ---------- Sky ---------- */
function buildSky() {
  var sky = $('#sky');
  for (var i = 0; i < 46; i++) {
    var s = 1 + (i * 7) % 3, d = (i % 7) * .6;
    sky.appendChild(el('span', { class: 'star', style: 'left:' + (i * 37.7 % 100) + '%;top:' + (i * 61.3 % 100) + '%;width:' + s * 2 + 'px;height:' + s * 2 + 'px;animation:twinkle ' + (2.4 + d) + 's ease-in-out ' + d + 's infinite' }));
  }
}

/* ---------- Events ---------- */
function canFS() { var d = document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen); }
function toggleFS() {
  var d = document, e = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { var p = (e.requestFullscreen || e.webkitRequestFullscreen).call(e); if (p && p.catch) p.catch(function () { toast(t('fsUnsupported')); }); }
  } catch (err) { toast(t('fsUnsupported')); }
}
function toggleMute() { S.sound = !S.sound; saveSettings(); try { localStorage.setItem('fc-muted', S.sound ? '0' : '1'); } catch (e) { } applyStrings(); if (S.sound) snd('tap'); }
function bind() {
  document.querySelectorAll('#langSeg button').forEach(function (b) { b.onclick = function () { setLang(b.getAttribute('data-lang')); }; });
  $('#bShuffle').onclick = function () { doShuffle(); $('#bShuffle').setAttribute('aria-pressed', 'true'); };
  $('#bReset').onclick = function () { doReset(); $('#bShuffle').setAttribute('aria-pressed', 'false'); };
  $('#bUpload').onclick = function () { snd('tap'); openUpload(); };
  $('#deckChip').onclick = function () { snd('tap'); openLibrary(); };
  $('#bSrs1').onclick = function () { srsGrade('again'); }; $('#bSrs2').onclick = function () { srsGrade('good'); }; $('#bSrs3').onclick = function () { srsGrade('easy'); };
  $('#bMute').onclick = toggleMute;
  if (canFS()) $('#bFull').onclick = toggleFS; else $('#bFull').classList.add('hidden');
  $('#bSettings').onclick = function () { snd('tap'); openSettings(); };
  $('#bPrev').onclick = function () { go(-1); };
  $('#bNext').onclick = function () { go(1); };
  $('#bAgain').onclick = function () { mark('a'); };
  $('#bKnow').onclick = function () { mark('k'); };
  $('#fileIn').onchange = function (e) { handleFiles(e.target.files); e.target.value = ''; };
  var stage = $('#stage'), t0 = null;
  stage.addEventListener('touchstart', function (e) { if (e.touches.length === 1) t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    var k = t0; t0 = null; if (!k || A.st.done || OPEN) return;
    if (e.target.closest && e.target.closest('.aud,.tbl,input,.m3d')) return;
    var dx = e.changedTouches[0].clientX - k.x, dy = e.changedTouches[0].clientY - k.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { A.swiped = true; setTimeout(function () { A.swiped = false; }, 400); go(dx < 0 ? 1 : -1); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (OPEN) {
      if (e.key === 'Tab') return trapTab(e);
      if (e.key === 'Escape') { e.preventDefault(); closeOverlay(); }
      else if (OPEN.kind === 'lb' && e.key === 'ArrowRight') OPEN.node.lbStep(1);
      else if (OPEN.kind === 'lb' && e.key === 'ArrowLeft') OPEN.node.lbStep(-1);
      return;
    }
    var tg = e.target, k = e.key;
    if (tg.closest && tg.closest('input,textarea,select,[contenteditable="true"]')) return;
    if (k === ' ' || k === 'Enter') { if (tg.closest && tg.closest('button,a,summary')) return;   /* buttons (incl. the flip button) handle it */ e.preventDefault(); if (!A.st.done) flip(); }
    else if (k === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (k === '1') { if (A.st.mode === 'srs') srsGrade('again'); else mark('a'); }
    else if (k === '2') { if (A.st.mode === 'srs') srsGrade('good'); else mark('k'); }
    else if (k === '3' && A.st.mode === 'srs') srsGrade('easy');
    else if (k === 's' || k === 'S') toggleStar();
    else if ((k === 'h' || k === 'H') && !A.flipped) toggleHint();
    else if (k === 'm' || k === 'M') toggleMute();
    else if ((k === 'f' || k === 'F') && canFS()) toggleFS();
    else if (k === '?') openHelp();
  });
  if (window.matchMedia) { var mq = matchMedia('(prefers-reduced-motion: reduce)'); if (mq.addEventListener) mq.addEventListener('change', applyBody); }
}
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;   /* file:// = no Service Worker */
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    var offer = function (w) { toast(t('updateAvail'), { label: t('reload'), fn: function () { w.postMessage('SKIP_WAITING'); } }); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', function () { var w = reg.installing; if (!w) return; w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
    var reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (!reloaded) { reloaded = true; location.reload(); } });
  }).catch(function () { });
}

/* ---------- Boot ---------- */
function boot() {
  buildSky(); registerSampleMedia();
  DB.open().then(function () { return kvGet('settings'); }).then(function (saved) {
    if (saved) Object.assign(S, saved);
    else { try { var l = localStorage.getItem('fc-lang'); if (l === 'en' || l === 'my') S.ui = l; if (localStorage.getItem('fc-muted') === '1') S.sound = false; } catch (e) { } }
    return DB.keys('media');
  }).then(function (keys) {
    (keys || []).forEach(function (k) { MEDIA.names.add(k); });
    return migrateV1();
  }).then(function () { return kvGet('streak'); }).then(function (sk) { A.streak = sk || {}; return kvGet('deckIndex'); }).then(function (idx) {
    A.index = idx || [];
    return kvGet('current');
  }).then(function (id) {
    bind();
    return openDeck(id || 's-konbaung');
  }).then(registerSW).catch(function (e) { console.error(e); bind(); A.deck = SAMPLES[0].build(); A.st = newState(); startSession(idsFor(null), false); renderAll(); });
}
document.addEventListener('DOMContentLoaded', boot);

</script>
